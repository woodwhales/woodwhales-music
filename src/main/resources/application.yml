server:
  port: 8084
  address: 0.0.0.0
  servlet:
    context-path: /

spring:
  application:
    name: woodwhales-music
  servlet:
    multipart:
      max-file-size: 4GB
      max-request-size: 4GB
  thymeleaf:
    cache: false
  devtools:
    restart:
      enabled: true
      additional-paths:
        - src/main/java/**
        - resources/**
  datasource:
    url: jdbc:postgresql://${PG_HOST:127.0.0.1}:${PG_PORT:5432}/${PG_DATABASE:open_music}
    driver-class-name: org.postgresql.Driver
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:postgres}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  profiles:
    active: '@profiles.active@'

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
logging:
  level:
    org.woodwhales.music: debug
music:
  link:
    # 链接来源：0-github，1-alist
    source: 1
  # 音乐网站首页
  site: "https://music.icoders.cn"
author:
  # 作者名称
  name: "woodwhales"
  # 作者网站
  website: "https://www.woodwhales.cn"
github:
  # 是否展示 GitHub Corners
  show: true
  # github 链接
  url: "https://github.com/woodwhales/woodwhales-music"
system:
  version: '@project.version@'
  init:
    # 后台系统admin账号的登录密码，每次初始化都会初始化
    password: ${SYSTEM_INIT_PASSWORD:admin}
