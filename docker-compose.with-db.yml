# 一体化编排（全新环境）：内置 postgis 数据库 + 应用，自动建库、自动迁移
# 注意：若宿主机 5432 已被占用，用 PG_PUBLISH_PORT 改变数据库对外映射端口，如：
#   PG_PUBLISH_PORT=55432 docker compose -f docker-compose.with-db.yml up -d --build
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: woodwhales-music-postgres
    environment:
      POSTGRES_DB: open_music
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${PG_PUBLISH_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d open_music"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    image: woodwhales/woodwhales-music:latest
    build:
      context: .
      args:
        JAR_FILE: woodwhales-music.jar
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: open_music
      PG_USER: postgres
      PG_PASSWORD: ${PG_PASSWORD:-postgres}
      SYSTEM_INIT_PASSWORD: ${SYSTEM_INIT_PASSWORD:-admin}
    ports:
      - "8084:8084"
    restart: unless-stopped

volumes:
  postgres-data:
