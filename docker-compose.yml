# 默认编排：独立 postgis 数据库 + 应用，自动建库、自动迁移
# 数据库对外映射端口默认 5434（避开宿主机 5432 上已有的数据库服务），可用 PG_PUBLISH_PORT 覆盖
# 若已有可复用的外部 PostgreSQL 实例，改用：docker compose -f docker-compose.app-only.yml up -d --build
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: woodwhales-music-postgres
    environment:
      POSTGRES_DB: open_music
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${PG_PUBLISH_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d open_music"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    image: woodwhales/woodwhales-music:latest
    build:
      context: .
      args:
        JAR_FILE: woodwhales-music.jar
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 应用经 compose 内部网络直连数据库容器，固定 5432，与宿主机映射端口无关
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: open_music
      PG_USER: postgres
      PG_PASSWORD: ${PG_PASSWORD:-postgres}
      SYSTEM_INIT_PASSWORD: ${SYSTEM_INIT_PASSWORD:-admin}
    ports:
      - "8084:8084"
    restart: unless-stopped

volumes:
  postgres-data:
